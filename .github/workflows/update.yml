name: Update DART financial data
on:
  workflow_dispatch:
  schedule:
    # UTC 21:15 on days 28-31; job checks Korean local date and runs only on the 1st.
    - cron: '15 21 28-31 * *'
permissions:
  contents: write
concurrency:
  group: dart-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: datecheck
        name: Check monthly schedule in KST
        run: echo "run_monthly=$( [ \"$(TZ=Asia/Seoul date +'%d')\" = '01' ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'workflow_dispatch' || steps.datecheck.outputs.run_monthly == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - if: github.event_name == 'workflow_dispatch' || steps.datecheck.outputs.run_monthly == 'true'
        run: python -m pip install -r requirements.txt
      - if: github.event_name == 'workflow_dispatch' || steps.datecheck.outputs.run_monthly == 'true'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update.py
      - if: github.event_name == 'workflow_dispatch' || steps.datecheck.outputs.run_monthly == 'true'
        name: Commit changed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data reports
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'chore: monthly OpenDART update'; git push; fi
